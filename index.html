<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Assistant</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{
  --bg:var(--tg-theme-bg-color,#fff); --text:var(--tg-theme-text-color,#111);
  --hint:var(--tg-theme-hint-color,#8a8f98); --link:var(--tg-theme-link-color,#2a7fd4);
  --btn:var(--tg-theme-button-color,#2a7fd4); --btn-text:var(--tg-theme-button-text-color,#fff);
  --bg2:var(--tg-theme-secondary-bg-color,#f1f2f5); --danger:#e5484d; --ok:#2f9e60; --warn:#d99a00;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg2);color:var(--text);
  font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
header{position:sticky;top:0;z-index:20;background:var(--bg2);padding:10px 12px 6px}
.tabs{display:flex;background:var(--bg);border-radius:12px;padding:3px;gap:3px}
.tabs button{flex:1;border:0;background:none;color:var(--text);padding:8px 4px;border-radius:9px;font-size:14px}
.tabs button.on{background:var(--btn);color:var(--btn-text)}
main{padding:6px 12px 110px}
.card{background:var(--bg);border-radius:14px;padding:12px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.hint{color:var(--hint);font-size:13px}
.small{font-size:13px}
h3{margin:0 0 6px;font-size:15px}
.day.today{outline:2px solid var(--btn)}
.ev{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--bg2);cursor:pointer}
.ev:first-of-type{border-top:0}
.ev .t{min-width:88px;font-weight:600;font-variant-numeric:tabular-nums}
.ev .leave{color:var(--hint);font-size:12.5px;margin-top:2px}
.ev.pending .t::after{content:" •";color:var(--warn)}
.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--btn);color:var(--btn-text);font-size:15px;cursor:pointer}
.btn.sec{background:var(--bg2);color:var(--text)}
.btn.red{background:var(--danger);color:#fff}
.btn.full{width:100%}
.btn.sm{padding:6px 10px;font-size:13px}
.link{color:var(--link);background:none;border:0;padding:0;font-size:14px;cursor:pointer}
label{display:block;font-size:13px;color:var(--hint);margin:10px 0 4px}
input,select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bg2);background:var(--bg2);
  color:var(--text);font-size:16px;font-family:inherit}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{border:0;border-radius:18px;padding:7px 11px;background:var(--bg2);color:var(--text);font-size:14px}
.chip.on{background:var(--btn);color:var(--btn-text)}
.btn.sec.on{outline:2px solid var(--btn)}
.leaflet-tooltip{font-size:12px;padding:2px 6px}
.seg{display:flex;background:var(--bg2);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;color:var(--text);padding:7px;border-radius:8px}
.seg button.on{background:var(--bg);font-weight:600}
.bar{height:8px;border-radius:4px;background:var(--bg2);overflow:hidden;margin-top:4px}
.bar>i{display:block;height:100%;background:var(--btn);border-radius:4px}
.bar>i.warn{background:var(--warn)} .bar>i.over{background:var(--danger)}
.big{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.tx{display:flex;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--bg2)}
.tx:first-of-type{border-top:0}
.tx .m{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx.del{opacity:.4;text-decoration:line-through}
.in{color:var(--ok)}
#map{height:340px;border-radius:14px;margin-bottom:10px;z-index:1}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--bg);border-radius:16px 16px 0 0;
  padding:14px 14px 24px;max-height:88vh;overflow:auto;display:none}
.sheet h2{margin:0 0 4px;font-size:17px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stack>*+*{margin-top:8px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:9px 14px;
  border-radius:10px;font-size:14px;z-index:60;display:none;max-width:90%}
#savebar{position:fixed;left:0;right:0;bottom:0;padding:10px 12px 16px;background:var(--bg2);z-index:30;display:none}
.empty{color:var(--hint);text-align:center;padding:24px 0}
</style>
</head>
<body>
<header>
  <div class="tabs" id="tabs">
    <button data-tab="sched" class="on" id="tab-sched"></button>
    <button data-tab="fin" id="tab-fin"></button>
    <button data-tab="trans" id="tab-trans"></button>
  </div>
</header>
<main id="main"></main>
<div class="sheet-bg" id="sheetbg"></div>
<div class="sheet" id="sheet"></div>
<div id="savebar"><div class="row"><button class="btn sec" id="resetbtn"></button><button class="btn full" id="savebtn"></button></div></div>
<div id="toast"></div>
<script>
"use strict";
const tg = (window.Telegram && window.Telegram.WebApp) || null;
const IN_TG = !!(tg && tg.initData !== undefined && tg.platform && tg.platform !== "unknown");
let D = null, LANG = "ru";
const T = (en, ru) => (LANG === "ru" ? ru : en);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = id => document.getElementById(id);
const WD = () => LANG === "ru" ? ["Пн","Вт","Ср","Чт","Пт","Сб","Вс"] : ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const WDL = () => LANG === "ru" ? ["Понедельник","Вторник","Среда","Четверг","Пятница","Суббота","Воскресенье"]
                              : ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];

// ---------------------------------------------------------------- dates (strings YYYY-MM-DD, local)
const pad = n => String(n).padStart(2, "0");
const toDate = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const fmtD = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const addDays = (s, n) => { const d = toDate(s); d.setDate(d.getDate() + n); return fmtD(d); };
const wdOf = s => (toDate(s).getDay() + 6) % 7;
const ddmm = s => `${s.slice(8, 10)}.${s.slice(5, 7)}`;
const toMin = hhmm => { const m = /^(\d{1,2}):(\d{2})$/.exec(hhmm || ""); return m ? +m[1] * 60 + +m[2] : null; };
const fromMin = m => { m = ((m % 1440) + 1440) % 1440; return `${pad(Math.floor(m / 60))}:${pad(m % 60)}`; };
const money = v => Math.round(v).toLocaleString("ru-RU").replace(/ /g, " ");

function parseAmount(s) {
  s = String(s || "").toLowerCase().replace(/\s+/g, "").replace(/сум|uzs|so'm|sum/g, "");
  const m = /^([\d.,]+)(k|к|тыс|m|м|млн|mln)?$/.exec(s);
  if (!m) return null;
  let n = m[1];
  if (n.includes(",") && n.includes(".")) n = n.replace(/[.,](?=\d{3}(\D|$))/g, "");
  else if (/^\d{1,3}([.,]\d{3})+$/.test(n)) n = n.replace(/[.,]/g, "");
  else n = n.replace(",", ".");
  const v = parseFloat(n);
  if (!isFinite(v)) return null;
  const mult = {k: 1e3, "к": 1e3, "тыс": 1e3, m: 1e6, "м": 1e6, "млн": 1e6, mln: 1e6}[m[2]] || 1;
  return v * mult;
}

// ---------------------------------------------------------------- data
async function decodeData() {
  let d = new URLSearchParams(location.search).get("d");
  if (!d) d = new URLSearchParams(location.hash.slice(1)).get("d");
  if (!d) return null;
  const b64 = d.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((d.length + 3) % 4);
  const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  if (typeof DecompressionStream === "undefined") throw new Error("no DecompressionStream");
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate"));
  return JSON.parse(await new Response(stream).text());
}

let M; // working model (local preview of pending changes)
let P; // pending changes to send
let tmpId = -1;
function initModel() {
  M = {
    events: D.e.map(a => ({id: a[0], title: a[1], start: a[2], end: a[3], date: a[4], wd: a[5] ? a[5].split(",").map(Number) : [],
                           place: a[6], remind: a[7]})),
    skips: new Set(D.k.map(a => a[0] + "|" + a[1])),
    places: D.p.map(a => ({id: a[0], name: a[1], lat: a[2], lon: a[3], home: !!a[4], travel: a[5]})),
    lines: D.n.map(a => ({id: a[0], place: a[1], name: a[2], stop: a[3], first: a[4], last: a[5], headway: a[6], wt: a[7],
                          ride: a[8], wf: a[9]})),
    tx: D.x.map(a => ({id: a[0], ts: a[1], dir: a[2], amount: a[3], cur: a[4], merchant: a[5], cat: a[6]})),
    fin: {inc: D.f.in, cats: Object.fromEntries(D.f.c), budgets: Object.fromEntries(D.f.b)},
  };
  P = {ops: [], tx: [], dx: [], pl: [], pd: [], la: [], ld: [], b: []};
}
const pendingCount = () => Object.values(P).reduce((n, a) => n + a.length, 0);
const today = () => D.t.slice(0, 10);
const nowMin = () => toMin(D.t.slice(11, 16));
const placeById = id => M.places.find(p => p.id === id);
const placeName = id => (placeById(id) || {}).name || "";

// ---------------------------------------------------------------- schedule logic (mirrors the bot)
function occurrences(day) {
  const w = wdOf(day);
  return M.events.filter(e => !M.skips.has(e.id + "|" + day) && (e.date === day || (!e.date && e.wd.includes(w))))
                 .sort((a, b) => a.start.localeCompare(b.start));
}
function departures(ln) {
  const first = toMin(ln.first) ?? 360; let last = toMin(ln.last) ?? 1380;
  if (last <= first) last += 1440;
  const out = []; const step = Math.max(1, ln.headway);
  for (let t = first; t <= last && out.length < 500; t += step) out.push(t);
  return out;
}
function planTrip(ev, day) {
  const place = placeById(ev.place);
  if (!place || place.home) return null;
  const st = toMin(ev.start); if (st == null) return null;
  const earlier = occurrences(day).filter(e => e.id !== ev.id && e.start < ev.start);
  if (earlier.length && earlier[earlier.length - 1].place === ev.place) return null;
  const must = st - 5; let best = null;
  for (const ln of M.lines.filter(l => l.place === place.id)) {
    const latest = must - ln.ride - ln.wf;
    const deps = departures(ln).filter(d => d <= latest);
    if (!deps.length) continue;
    const dep = deps[deps.length - 1], leave = dep - ln.wt;
    if (!best || leave > best.leave) best = {leave, line: ln.name, stop: ln.stop, dep, arrive: dep + ln.ride + ln.wf};
  }
  if (!best) best = {leave: must - place.travel, line: null, arrive: must, minutes: place.travel};
  return best;
}
function planText(p) {
  if (!p) return "";
  if (p.line) return T(`🚶 leave ${fromMin(p.leave)} → ${esc(p.line)} at ${fromMin(p.dep)} → ~${fromMin(p.arrive)}`,
                       `🚶 выйти в ${fromMin(p.leave)} → ${esc(p.line)} в ${fromMin(p.dep)} → ~${fromMin(p.arrive)}`);
  return T(`🚶 leave ~${fromMin(p.leave)} (~${p.minutes} min)`, `🚶 выйти ~${fromMin(p.leave)} (~${p.minutes} мин)`);
}

// pending schedule ops (also update the local preview)
function queueOp(op, isNewEvent) {
  P.ops.push(op);
  if (isNewEvent) op._tmp = isNewEvent;
  refresh();
}
function opPlace(id) { return id ? placeName(id) : ""; }

// ---------------------------------------------------------------- UI shell
let tab = "sched", weekStart = null;
function setTab(t) {
  tab = t;
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === t));
  render();
}
function toast(msg) { const el = $("toast"); el.textContent = msg; el.style.display = "block"; clearTimeout(toast._t); toast._t = setTimeout(() => el.style.display = "none", 2600); }
function openSheet(html, onMount) {
  $("sheet").innerHTML = html; $("sheet").style.display = "block"; $("sheetbg").style.display = "block";
  if (tg && tg.BackButton) { tg.BackButton.show(); }
  if (onMount) onMount($("sheet"));
}
function closeSheet() {
  $("sheet").style.display = "none"; $("sheetbg").style.display = "none"; $("sheet").innerHTML = "";
  if (tg && tg.BackButton) tg.BackButton.hide();
}
function refresh() {
  const n = pendingCount();
  const label = T(`Save to bot (${n})`, `Сохранить в бот (${n})`);
  if (IN_TG && tg.MainButton) {
    $("savebar").style.display = n ? "block" : "none";
    $("savebtn").style.display = "none";
    if (n) { tg.MainButton.setText(label); tg.MainButton.show(); } else tg.MainButton.hide();
  } else {
    $("savebar").style.display = n ? "block" : "none";
    $("savebtn").style.display = "";
    $("savebtn").textContent = label;
  }
  render();
}

// ---------------------------------------------------------------- schedule tab
function renderSched() {
  const t = today();
  if (!weekStart) weekStart = addDays(t, -wdOf(t));
  let h = `<div class="card row between"><button class="btn sec sm" id="wprev">◀</button>
    <b>${ddmm(weekStart)} – ${ddmm(addDays(weekStart, 6))}</b><button class="btn sec sm" id="wnext">▶</button></div>
    <button class="btn full" id="addev" style="margin-bottom:10px">＋ ${T("Add event", "Добавить событие")}</button>`;
  for (let i = 0; i < 7; i++) {
    const day = addDays(weekStart, i), evs = occurrences(day);
    h += `<div class="card day ${day === t ? "today" : ""}"><h3>${WDL()[i]} <span class="hint">${ddmm(day)}</span></h3>`;
    if (!evs.length) h += `<div class="hint">—</div>`;
    for (const e of evs) {
      const pl = placeById(e.place), plan = planTrip(e, day);
      h += `<div class="ev ${e.id < 0 ? "pending" : ""}" data-ev="${e.id}" data-day="${day}">
        <div class="t">${esc(e.start)}${e.end ? "–" + esc(e.end) : ""}</div>
        <div><div>${esc(e.title)} ${e.date ? "" : "<span class='hint'>🔁</span>"}</div>
        ${pl ? `<div class="hint small">📍 ${esc(pl.name)}</div>` : ""}
        ${plan ? `<div class="leave">${planText(plan)}</div>` : ""}</div></div>`;
    }
    h += `</div>`;
  }
  h += `<div class="hint small" style="text-align:center">${T("Data as of", "Данные на")} ${esc(D.t.replace("T", " "))}.
        ${T("To refresh, send /app to the bot.", "Чтобы обновить, отправьте боту /app.")}</div>`;
  $("main").innerHTML = h;
  $("wprev").onclick = () => { weekStart = addDays(weekStart, -7); render(); };
  $("wnext").onclick = () => { weekStart = addDays(weekStart, 7); render(); };
  $("addev").onclick = () => eventSheet(null, t);
  document.querySelectorAll(".ev").forEach(el => el.onclick = () =>
    eventSheet(M.events.find(e => e.id === +el.dataset.ev), el.dataset.day));
}

function eventSheet(ev, day) {
  if (ev && ev.locked) { toast(T("Save first, then edit this one", "Сначала сохраните, потом редактируйте")); return; }
  const isNew = !ev;
  const e = ev || {title: "", start: "09:00", end: "10:00", date: day, wd: [], place: 0};
  let recurring = isNew ? false : !e.date;
  let days = new Set(e.wd.length ? e.wd : [wdOf(day)]);
  const placeOpts = `<option value="0">— ${T("no place", "без места")} —</option>` +
    M.places.filter(p => !p.home).map(p => `<option value="${p.id}" ${p.id === e.place ? "selected" : ""}>${esc(p.name)}</option>`).join("");
  const html = `<h2>${isNew ? T("New event", "Новое событие") : esc(e.title)}</h2>
    ${!isNew && !e.date ? `<div class="hint">${T("Repeats weekly · selected day", "Повторяется · выбранный день")} ${ddmm(day)}</div>` : ""}
    <label>${T("Title", "Название")}</label><input id="f-title" value="${esc(e.title)}" maxlength="200">
    <div class="grid2"><div><label>${T("Start", "Начало")}</label><input type="time" id="f-start" value="${esc(e.start)}"></div>
    <div><label>${T("End", "Конец")}</label><input type="time" id="f-end" value="${esc(e.end)}"></div></div>
    <label>${T("When", "Когда")}</label>
    <div class="seg" id="f-mode"><button data-m="once">${T("Once", "Один раз")}</button><button data-m="rep">${T("Weekly", "Каждую неделю")}</button></div>
    <div id="f-dates" style="margin-top:8px"></div>
    <label>${T("Place", "Место")}</label><select id="f-place">${placeOpts}</select>
    <div class="stack" style="margin-top:16px" id="f-actions"></div>`;
  openSheet(html, sh => {
    const drawWhen = () => {
      sh.querySelectorAll("#f-mode button").forEach(b => b.classList.toggle("on", (b.dataset.m === "rep") === recurring));
      $("f-dates").innerHTML = recurring
        ? `<div class="chips">${WD().map((n, i) => `<button class="chip ${days.has(i) ? "on" : ""}" data-d="${i}">${n}</button>`).join("")}</div>`
        : `<input type="date" id="f-date" value="${esc(e.date || day)}">`;
      $("f-dates").querySelectorAll(".chip").forEach(c => c.onclick = () => {
        const d = +c.dataset.d; days.has(d) ? days.delete(d) : days.add(d); drawWhen(); });
    };
    sh.querySelectorAll("#f-mode button").forEach(b => b.onclick = () => { recurring = b.dataset.m === "rep"; drawWhen(); });
    drawWhen();
    const read = () => {
      const title = $("f-title").value.trim(), start = $("f-start").value, end = $("f-end").value;
      if (!title || !start) { toast(T("Title and start time are required", "Нужны название и время начала")); return null; }
      if (end && end <= start) { toast(T("End must be after start", "Конец должен быть позже начала")); return null; }
      if (recurring && !days.size) { toast(T("Pick at least one day", "Выберите хотя бы один день")); return null; }
      const date = recurring ? "" : (($("f-date") || {}).value || day);
      return {title, start, end, date, wd: recurring ? [...days].sort() : [], place: +$("f-place").value};
    };
    const A = $("f-actions");
    const btn = (cls, text, fn) => { const b = document.createElement("button"); b.className = "btn full " + cls; b.textContent = text; b.onclick = fn; A.appendChild(b); };
    if (isNew) {
      btn("", T("Add", "Добавить"), () => {
        const v = read(); if (!v) return;
        const id = tmpId--;
        M.events.push({id, ...v, remind: 15});
        queueOp({action: "add", title: v.title, start: v.start, end: v.end, date: v.date || undefined,
                 weekdays: v.wd.length ? v.wd : undefined, place: opPlace(v.place)}, id);
        closeSheet(); toast(T("Added (not saved yet)", "Добавлено (ещё не сохранено)"));
      });
      return;
    }
    if (e.id < 0) { // an unsaved new event: edit or drop the queued "add"
      const op = P.ops.find(o => o._tmp === e.id);
      btn("", T("Update", "Обновить"), () => {
        const v = read(); if (!v || !op) return;
        Object.assign(e, v);
        Object.assign(op, {title: v.title, start: v.start, end: v.end, date: v.date || undefined,
                           weekdays: v.wd.length ? v.wd : undefined, place: opPlace(v.place)});
        closeSheet(); refresh();
      });
      btn("red", T("Remove", "Убрать"), () => {
        M.events = M.events.filter(x => x.id !== e.id);
        P.ops = P.ops.filter(o => o !== op && o._tmp !== e.id);
        closeSheet(); refresh();
      });
      return;
    }
    btn("", recurring || !e.date ? T("Save for all weeks", "Сохранить для всех недель") : T("Save", "Сохранить"), () => {
      const v = read(); if (!v) return;
      Object.assign(e, {title: v.title, start: v.start, end: v.end, place: v.place, date: v.date, wd: v.wd});
      queueOp({action: "update", event_id: e.id, title: v.title, start: v.start, end: v.end, place: opPlace(v.place),
               ...(v.wd.length ? {weekdays: v.wd} : {date: v.date})});
      closeSheet();
    });
    if (!e.date) {
      btn("sec", T(`Change only ${ddmm(day)}`, `Изменить только ${ddmm(day)}`), () => {
        const v = read(); if (!v) return;
        M.skips.add(e.id + "|" + day);
        M.events.push({id: tmpId--, title: v.title, start: v.start, end: v.end, date: day, wd: [], place: v.place, remind: e.remind, locked: true});
        queueOp({action: "change_once", event_id: e.id, date: day, title: v.title, start: v.start, end: v.end, place: opPlace(v.place)});
        closeSheet();
      });
      btn("sec", T(`Skip ${ddmm(day)}`, `Пропустить ${ddmm(day)}`), () => {
        M.skips.add(e.id + "|" + day);
        queueOp({action: "skip_once", event_id: e.id, date: day});
        closeSheet();
      });
    }
    btn("red", T("Delete completely", "Удалить полностью"), () => {
      M.events = M.events.filter(x => x.id !== e.id);
      queueOp({action: "delete", event_id: e.id});
      closeSheet();
    });
  });
}

// ---------------------------------------------------------------- finance tab
function renderFin() {
  const cats = {...M.fin.cats};
  let inc = M.fin.inc;
  for (const t of P.tx) { if (t.d === "out") cats[t.c || "other"] = (cats[t.c || "other"] || 0) + t.a; else inc += t.a; }
  for (const t of M.tx) if (P.dx.includes(t.id) && t.cur === "UZS" && t.ts.slice(0, 7) === D.t.slice(0, 7)) {
    if (t.dir === "out") cats[t.cat] = Math.max(0, (cats[t.cat] || 0) - t.amount); else inc -= t.amount;
  }
  const out = Object.values(cats).reduce((a, b) => a + b, 0);
  const sorted = Object.entries(cats).sort((a, b) => b[1] - a[1]);
  const max = sorted.length ? sorted[0][1] : 1;
  let h = `<div class="card"><div class="hint">${T("This month, UZS", "Этот месяц, UZS")}</div>
    <div class="grid3" style="margin-top:6px">
      <div><div class="hint small">${T("Income", "Доход")}</div><div class="num in"><b>${money(inc)}</b></div></div>
      <div><div class="hint small">${T("Spent", "Расход")}</div><div class="num"><b>${money(out)}</b></div></div>
      <div><div class="hint small">${T("Net", "Итог")}</div><div class="num"><b>${money(inc - out)}</b></div></div></div></div>
    <div class="grid2" style="margin-bottom:10px">
      <button class="btn" id="addout">－ ${T("Expense", "Расход")}</button><button class="btn sec" id="addin">＋ ${T("Income", "Доход")}</button></div>`;
  h += `<div class="card"><h3>${T("By category", "По категориям")}</h3>`;
  if (!sorted.length) h += `<div class="hint">${T("No spending yet", "Расходов пока нет")}</div>`;
  for (const [c, v] of sorted) h += `<div style="margin:8px 0"><div class="row between small"><span>${esc(D.c[c] || c)}</span>
    <span class="num">${money(v)}</span></div><div class="bar"><i style="width:${Math.max(2, v / max * 100)}%"></i></div></div>`;
  h += `</div><div class="card"><div class="row between"><h3>${T("Budgets", "Бюджеты")}</h3>
    <button class="link" id="addbud">${T("Set", "Задать")}</button></div>`;
  const buds = Object.entries(M.fin.budgets);
  if (!buds.length) h += `<div class="hint">${T("No budgets", "Бюджетов нет")}</div>`;
  for (const [c, lim] of buds) {
    const spent = c === "total" ? out : (cats[c] || 0), pct = lim ? spent / lim : 0;
    h += `<div style="margin:8px 0"><div class="row between small"><span>${esc(c === "total" ? T("All spending", "Все расходы") : (D.c[c] || c))}</span>
      <span class="num">${money(spent)} / ${money(lim)}</span></div>
      <div class="bar"><i class="${pct >= 1 ? "over" : pct >= .8 ? "warn" : ""}" style="width:${Math.min(100, Math.max(2, pct * 100))}%"></i></div></div>`;
  }
  h += `</div><div class="card"><h3>${T("Recent", "Последние")}</h3>`;
  for (const t of P.tx) h += `<div class="tx"><span class="hint small">${T("new", "новое")}</span><span class="m">${esc(t.m || D.c[t.c] || "")}</span>
    <span class="num ${t.d === "in" ? "in" : ""}">${t.d === "in" ? "+" : "−"}${money(t.a)}</span></div>`;
  if (!M.tx.length && !P.tx.length) h += `<div class="hint">${T("No transactions yet", "Операций пока нет")}</div>`;
  for (const t of M.tx) {
    const del = P.dx.includes(t.id);

function budgetSheet() {
  openSheet(`<h2>${T("Monthly budget", "Месячный бюджет")}</h2>
    <label>${T("Category", "Категория")}</label><select id="b-c">${catOptions("total", true)}</select>
    <label>${T("Limit, UZS (0 = remove)", "Лимит, сум (0 = удалить)")}</label><input id="b-l" inputmode="decimal" placeholder="2m">

      closeSheet(); refresh();
    };
  });
}

// ---------------------------------------------------------------- city map, routes & stops (OpenStreetMap data)
const OVERPASS = ["https://overpass-api.de/api/interpreter", "https://maps.mail.ru/osm/tools/overpass/api/interpreter"];
const BBOX = "41.15,69.05,41.48,69.50"; // Tashkent (south,west,north,east)
const COLORS = ["#2a7fd4", "#e5484d", "#2f9e60", "#d99a00", "#8e4ec6", "#12a594", "#c2298a", "#5b6b7f"];
const OV = {routes: [], metro: false, stops: null, view: null, cache: {}};
const routeRef = s => { const m = /\d+[a-zа-яё]?/i.exec(String(s || "")); return m ? m[0].toUpperCase() : null; };
function cacheGet(k) { if (OV.cache[k]) return OV.cache[k]; try { const v = localStorage.getItem("ov:" + k); if (v) { const o = JSON.parse(v); if (Date.now() - o.t < 7 * 864e5) return (OV.cache[k] = o.d); } } catch (e) {} return null; }
function cachePut(k, d) { OV.cache[k] = d; try { localStorage.setItem("ov:" + k, JSON.stringify({t: Date.now(), d})); } catch (e) {} }
async function overpass(query) {
  let lastErr;
  for (const url of OVERPASS) {
    try {
      const r = await fetch(url, {method: "POST", body: "data=" + encodeURIComponent(query),
                                  headers: {"Content-Type": "application/x-www-form-urlencoded"}});
      if (!r.ok) throw new Error("HTTP " + r.status);
      return await r.json();
    } catch (e) { lastErr = e; }
  }
  throw lastErr || new Error("overpass failed");
}
// compact result: {lines: [[[lat,lon],...],...], stops: [[lat,lon,name],...], names: [...], colour}
function compact(json) {
  const names = {}, out = {lines: [], stops: [], names: [], colour: null};
  for (const el of json.elements || []) if (el.type === "node" && el.tags) names[el.id] = el.tags.name || el.tags["name:uz"] || el.tags["name:ru"] || "";
  const seen = new Set();
  for (const el of json.elements || []) {
    if (el.type !== "relation") continue;
    if (el.tags) { if (el.tags.name) out.names.push(el.tags.name); out.colour = out.colour || el.tags.colour || null; }
    for (const m of el.members || []) {
      if (m.type === "way" && m.geometry && !/platform/.test(m.role || "")) out.lines.push(m.geometry.map(g => [+g.lat.toFixed(5), +g.lon.toFixed(5)]));
      if (m.type === "node" && /stop|platform/.test(m.role || "") && m.lat != null) {
        const nm = names[m.ref] || ""; const key = nm || m.ref;
        if (!seen.has(key)) { seen.add(key); out.stops.push([+m.lat.toFixed(5), +m.lon.toFixed(5), nm]); }
      }
    }
  }
  return out;
}
async function fetchRoute(ref) {
  const hit = cacheGet("r:" + ref); if (hit) return hit;
  const q = `[out:json][timeout:25];relation["type"="route"]["route"~"^(bus|trolleybus|minibus|share_taxi)$"]["ref"="${ref}"](${BBOX})->.r;.r out geom;node(r.r);out tags;`;
  const d = compact(await overpass(q)); cachePut("r:" + ref, d); return d;
}
async function showRoute(ref) {
  if (OV.routes.some(r => r.ref === ref)) { toast(T("Already shown", "Уже показан")); return; }
  toast(T(`Loading route ${ref}…`, `Загружаю маршрут ${ref}…`));
  try {
    const d = await fetchRoute(ref);
    if (!d.lines.length) { toast(T(`Route ${ref} not found in OpenStreetMap`, `Маршрут ${ref} не найден в OpenStreetMap`)); return; }
    const used = OV.routes.map(r => r.color);
    OV.routes.push({ref, color: COLORS.find(c => !used.includes(c)) || COLORS[OV.routes.length % COLORS.length], d, fit: true});
    if (tab === "trans") renderTrans();
  } catch (e) { toast(T("Couldn't load map data. Check the internet and try again.", "Не удалось загрузить данные карты. Проверьте интернет и повторите.")); }
}
async function loadMetro() {
  try {
    let d = cacheGet("metro");
    if (!d) {
      const j = await overpass(`[out:json][timeout:25];relation["route"="subway"](${BBOX});out geom;node(r);out tags;`);
      d = {byLine: []};
      for (const el of (j.elements || []).filter(e => e.type === "relation")) {
        const one = compact({elements: [el, ...(j.elements || []).filter(e => e.type === "node")]});
        d.byLine.push({...one, colour: (el.tags && el.tags.colour) || "#d33"});
      }
      cachePut("metro", d);
    }
    OV.metroData = d;
    if (!d.byLine.length) toast(T("No metro data found", "Данные метро не найдены"));
  } catch (e) { OV.metro = false; toast(T("Couldn't load metro lines", "Не удалось загрузить линии метро")); }
  if (tab === "trans") renderTrans();
}
async function showStops() {
  const h = home();
  if (!h || h.lat == null) { toast(T("Add your home on the map first", "Сначала добавьте дом на карту")); return; }
  toast(T("Looking for stops…", "Ищу остановки…"));
  try {
    const k = `s:${h.lat.toFixed(3)},${h.lon.toFixed(3)}`;
    let d = cacheGet(k);
    if (!d) {
      const j = await overpass(`[out:json][timeout:25];node(around:700,${h.lat},${h.lon})["highway"="bus_stop"]->.s;.s out;rel(bn.s)["route"~"^(bus|trolleybus|minibus)$"];out body;`);
      const refs = {};
      for (const r of (j.elements || []).filter(e => e.type === "relation"))
        for (const m of r.members || []) if (m.type === "node" && r.tags && r.tags.ref) (refs[m.ref] = refs[m.ref] || new Set()).add(r.tags.ref);
      d = (j.elements || []).filter(e => e.type === "node").map(n => [n.lat, n.lon, (n.tags && n.tags.name) || "", [...(refs[n.id] || [])].sort((a, b) => parseInt(a) - parseInt(b))]);
      cachePut(k, d);
    }
    OV.stops = d; OV.view = [[h.lat, h.lon], 16];
    if (!d.length) toast(T("No stops found nearby in OpenStreetMap", "Рядом не найдено остановок в OpenStreetMap"));
    renderTrans();
  } catch (e) { toast(T("Couldn't load stops", "Не удалось загрузить остановки")); }
}
function drawChips() {
  const el = $("rt-chips"); if (!el) return;
  const mine = [...new Set(M.lines.map(l => routeRef(l.name)).filter(Boolean))];
  let h = mine.filter(r => !OV.routes.some(x => x.ref === r)).map(r => `<button class="chip" data-show="${esc(r)}">🚌 ${esc(r)}</button>`).join("");
  h += OV.routes.map(r => `<button class="chip on" data-hide="${esc(r.ref)}" style="background:${r.color}">${esc(r.ref)} ✕</button>`).join("");
  if (OV.stops) h += `<button class="chip on" data-hidestops="1">🚏 ✕</button>`;
  el.innerHTML = h || `<span class="hint small">${T("Your lines appear here. Routes come from OpenStreetMap.", "Здесь появятся ваши маршруты. Данные — OpenStreetMap.")}</span>`;
  el.querySelectorAll("[data-show]").forEach(b => b.onclick = () => showRoute(b.dataset.show));
  el.querySelectorAll("[data-hide]").forEach(b => b.onclick = () => { OV.routes = OV.routes.filter(r => r.ref !== b.dataset.hide); renderTrans(); });
  el.querySelectorAll("[data-hidestops]").forEach(b => b.onclick = () => { OV.stops = null; renderTrans(); });
}
function drawMap() {
  if (typeof window.L === "undefined") { $("map").innerHTML = `<div class="empty">${T("Map unavailable (no internet?)", "Карта недоступна (нет интернета?)")}</div>`; return; }
  const Lf = window.L;
  const h0 = home();
  const center = OV.view ? OV.view[0] : (h0 && h0.lat != null ? [h0.lat, h0.lon] : [41.2995, 69.2401]);
  map = Lf.map("map", {zoomControl: false}).setView(center, OV.view ? OV.view[1] : 12);
  Lf.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom: 19, attribution: "© OpenStreetMap"}).addTo(map);
  if (OV.metro && OV.metroData) for (const ln of OV.metroData.byLine) {
    for (const seg of ln.lines) Lf.polyline(seg, {color: ln.colour, weight: 5, opacity: .85}).addTo(map);
    for (const st of ln.stops) Lf.circleMarker([st[0], st[1]], {radius: 5, color: ln.colour, fillColor: "#fff", fillOpacity: 1, weight: 2})
      .addTo(map).bindPopup("Ⓜ️ " + esc(st[2]));
  }
  let bounds = null;
  for (const r of OV.routes) {
    for (const seg of r.d.lines) {
      const pl = Lf.polyline(seg, {color: r.color, weight: 4, opacity: .85}).addTo(map);
      if (r.fit) bounds = bounds ? bounds.extend(pl.getBounds()) : pl.getBounds();
    }
    for (const st of r.d.stops) Lf.circleMarker([st[0], st[1]], {radius: 4, color: r.color, fillColor: "#fff", fillOpacity: 1, weight: 2})
      .addTo(map).bindPopup(`🚏 ${esc(st[2] || T("Stop", "Остановка"))}<br><span style="color:${r.color}">● ${esc(r.ref)}</span>`);
    r.fit = false;
  }
  if (OV.stops) for (const st of OV.stops) {
    const routes = st[3].length ? st[3].map(x => `<a href="#" data-pop-route="${esc(x)}">${esc(x)}</a>`).join(", ") : "—";
    Lf.circleMarker([st[0], st[1]], {radius: 7, color: "#111", fillColor: "#ffd60a", fillOpacity: 1, weight: 2})
      .addTo(map).bindPopup(`🚏 <b>${esc(st[2] || T("Stop", "Остановка"))}</b><br>${T("Routes", "Маршруты")}: ${routes}`);
  }
  for (const p of M.places.filter(p => p.lat != null))
    Lf.marker([p.lat, p.lon]).addTo(map).bindTooltip((p.home ? "🏠 " : "📍 ") + esc(p.name), {permanent: true, direction: "top", offset: [-15, -12]});
  if (bounds) map.fitBounds(bounds, {padding: [20, 20]});
  map.on("moveend", () => { OV.view = [map.getCenter(), map.getZoom()]; });
  map.on("popupopen", ev => {
    const el = ev.popup.getElement && ev.popup.getElement();
    if (el) el.querySelectorAll("[data-pop-route]").forEach(a => a.onclick = e => { e.preventDefault(); showRoute(a.dataset.popRoute); });
  });
  map.on("click", ev => { if (addMode) { addMode = false; placeSheet(ev.latlng.lat, ev.latlng.lng); } });
}
function placeSheet(lat, lon) {
  openSheet(`<h2>${T("New place", "Новое место")}</h2><div class="hint">${lat.toFixed(5)}, ${lon.toFixed(5)}</div>
    <label>${T("Name", "Название")}</label><input id="p-n" maxlength="64" placeholder="${T("University", "Университет")}">
    <label>${T("Trip from home, minutes (estimate)", "Дорога из дома, минут (примерно)")}</label><input id="p-t" inputmode="numeric" value="30">
    <label class="row" style="color:var(--text);margin-top:12px"><input type="checkbox" id="p-h" style="width:auto"> ${T("This is my home", "Это мой дом")}</label>
    <button class="btn full" id="p-ok" style="margin-top:16px">${T("Add", "Добавить")}</button>`, () => {
    $("p-ok").onclick = () => {
      const n = $("p-n").value.trim(); if (!n) { toast(T("Enter a name", "Введите название")); return; }
      const t = Math.max(1, parseInt($("p-t").value, 10) || 30), h = $("p-h").checked, id = tmpId--;
      if (h) M.places.forEach(p => p.home = false);
      M.places.push({id, name: n, lat, lon, home: h, travel: t});
      P.pl.push({n, lat: +lat.toFixed(6), lon: +lon.toFixed(6), t, h: h ? 1 : 0, _tmp: id});
      closeSheet(); refresh();
    };
  });
}
function lineSheet() {
  const dest = M.places.filter(p => !p.home);
  if (!dest.length) { toast(T("Add a destination place first", "Сначала добавьте место назначения")); return; }
  openSheet(`<h2>${T("New line", "Новый маршрут")}</h2>
    <label>${T("To place", "До места")}</label><select id="l-p">${dest.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join("")}</select>
    <div class="grid2"><div><label>${T("Name", "Название")}</label><input id="l-n" placeholder="${T("Bus 17", "Автобус 17")}"></div>
      <div><label>${T("Boarding stop", "Остановка посадки")}</label><input id="l-s"></div></div>
    <div class="grid3"><div><label>${T("First", "Первый")}</label><input type="time" id="l-f" value="06:00"></div>
      <div><label>${T("Last", "Последний")}</label><input type="time" id="l-l" value="22:00"></div>
      <div><label>${T("Every, min", "Интервал")}</label><input id="l-h" inputmode="numeric" value="10"></div></div>
    <div class="grid3"><div><label>${T("Walk to stop", "Пешком до")}</label><input id="l-wt" inputmode="numeric" value="5"></div>
      <div><label>${T("Ride", "В пути")}</label><input id="l-r" inputmode="numeric" value="25"></div>
      <div><label>${T("Walk after", "Пешком после")}</label><input id="l-wf" inputmode="numeric" value="5"></div></div>
    <button class="btn full" id="l-ok" style="margin-top:16px">${T("Add", "Добавить")}</button>`, () => {
    $("l-ok").onclick = () => {
      const pid = +$("l-p").value, n = $("l-n").value.trim();
      if (!n) { toast(T("Enter a name", "Введите название")); return; }
      const num = id => Math.max(0, parseInt($(id).value, 10) || 0);
      const ln = {id: tmpId--, place: pid, name: n, stop: $("l-s").value.trim(), first: $("l-f").value, last: $("l-l").value,
                  headway: Math.max(1, num("l-h")), wt: num("l-wt"), ride: num("l-r"), wf: num("l-wf")};
      M.lines.push(ln);
      const item = {n, s: ln.stop, f: ln.first, l: ln.last, h: ln.headway, wt: ln.wt, r: ln.ride, wf: ln.wf};
      if (pid > 0) item.p = pid; else item.pn = placeName(pid);
      P.la.push(item);
      closeSheet(); refresh();
    };
  });
}

// ---------------------------------------------------------------- save
function payload() {
  const clean = o => { const c = {...o}; delete c._tmp; return c; };
  return {v: 1, ops: P.ops.map(clean), tx: P.tx, dx: P.dx, pl: P.pl.map(clean), pd: P.pd, la: P.la, ld: P.ld, b: P.b};
}
function save() {
  const s = JSON.stringify(payload());
  if (new TextEncoder().encode(s).length > 4000) {
    alert(T("Too many changes at once. Remove a few and save in two steps.", "Слишком много изменений сразу. Уберите часть и сохраните в два приёма."));
    return;
  }
  if (IN_TG && tg.sendData) tg.sendData(s); // closes the Mini App; the bot replies in the chat
  else { window.__lastPayload = s; console.log("PAYLOAD", s); toast("Payload ready (not in Telegram)"); }
}

function render() {
  if (!D) return;
  if (map) { try { map.remove(); } catch (e) {} map = null; }
  if (tab === "sched") renderSched(); else if (tab === "fin") renderFin(); else renderTrans();
}

// ---------------------------------------------------------------- boot
(async function boot() {
  if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }
  try { D = await decodeData(); } catch (e) { D = null; console.error(e); }
  LANG = (D && D.l) || ((tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.language_code) === "en" ? "en" : "ru");
  $("tab-sched").textContent = "📅 " + T("Schedule", "Расписание");
  $("tab-fin").textContent = "💰 " + T("Finance", "Финансы");
  $("tab-trans").textContent = "🚌 " + T("Transit", "Транспорт");
  $("resetbtn").textContent = T("Discard", "Сбросить");
  if (!D) {
    $("main").innerHTML = `<div class="card empty">${T("Open this app from the <b>📱</b> button in the bot chat (send /app to get it).",
      "Откройте приложение кнопкой <b>📱 Приложение</b> в чате с ботом (отправьте /app, чтобы её получить).")}</div>`;
    return;
  }
  initModel();
  document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => setTab(b.dataset.tab));
  $("sheetbg").onclick = closeSheet;
  $("savebtn").onclick = save;
  $("resetbtn").onclick = () => { initModel(); tmpId = -1; refresh(); toast(T("Changes discarded", "Изменения сброшены")); };
  if (tg && tg.MainButton) tg.MainButton.onClick(save);
  if (tg && tg.BackButton) tg.BackButton.onClick(closeSheet);
  refresh();
})();
</script>
</body>
</html>
